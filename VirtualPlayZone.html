<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Virtual Play Zone</title>
    <style>
        nav {
            background-color: rgb(114, 151, 206);
            color: black;
            padding: 40px;
        }
        
        h1 {
            font-size: 40px;
            background-color: rgb(114, 151, 206);
            color: black;
            margin-bottom: 30px;
            text-align: center;
        }
        
        h2 {
            font-size: 40px;
            margin-bottom: 30px;
            text-align: center;
        }
        
        .category-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
        }
        
        .category-item {
            text-align: center;
            width: 200px;
            height: 500px;
            list-style: none;
        }
        
        .category-item img {
            width: 150%;
            height: 50%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        
        .category-item a {
            color: black;
            text-decoration: none;
            display: block;
            padding: 10px;
            border-radius: 5px;
            margin-top: 20px;
            text-wrap-mode: nowrap;
            text-align: center;
        }
        
        .category-item a:hover {
            color: white;
        }
    </style>
</head>


<body>

    <h1>VIRTUAL PLAY ZONE</h1>


    <h2>Categorias</h2>

    <nav>
        <ul class="category-list">
            <li class="category-item">
                <a class="h2" href="Accion.html">Accion</a>
                <img src="Accion.png" alt="Accion">
            </li>

            <li class="category-item">
                <a class="h2" href="Carreras.html">Carreras</a>
                <img src="Carreras.png" alt="Carreras">
            </li>

            <li class="category-item">
                <a class="h2" href="FreeToPlay.html">Free to Play</a>
                <img src="FreeToPlay.png" alt="FreetoPlay">
            </li>

            <li class="category-item">
                <a class="h2" href="MundoAbierto.html">Mundo Abierto</a>
                <img src="MundoAbiertoFot.png" alt="MundoAbierto">
            </li>

            <li class="category-item">
                <a class="h2" href="Supervivencia.html">Supervivencia</a>
                <img src="SupervivenciaFoto.png" alt="Supervivencia">
            </li>

            <li class="category-item">
                <a class="h2" href="Terror.html">Terror</a>
                <img src="TerrorFoto.png" alt="Terror">
            </li>
        </ul>
    </nav>

</body>

</html>
