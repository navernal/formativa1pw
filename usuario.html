<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil de Usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        body {
            background-image: url('../img/fondo.jpg');
            background-size: cover;
            background-position: center;
            color: white;
        }

        .perfil-container {
            max-width: 400px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            margin: 100px auto;
        }

        .btn-success {
            background-color: #28a745;
            border: none;
        }

        .btn-success:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="../img/virtual3.png" width="35px" class="png">
                <strong>Virtual Play Zone</strong>
            </a>
        </div>
    </nav>

    <!-- Perfil del Usuario -->
    <div class="perfil-container">
        <h2 class="text-center">Perfil de Usuario</h2>
        <p><strong>Usuario:</strong> <span id="nombreUsuario"></span></p>
        <button class="btn btn-success w-100" onclick="modificarPerfil()">Modificar Perfil</button>
    </div>

    <script>
        document.getElementById("nombreUsuario").innerText = localStorage.getItem("usuario") || "Usuario";
        
        function modificarPerfil() {
            alert("Función para modificar perfil en desarrollo...");
        }
    </script>

</body>
</html>
