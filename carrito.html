<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito de Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        body {
            background-image: url('../img/fondo.jpg');
            background-size: cover;
            background-position: center;
            color: white;
        }

        .carrito-container {
            max-width: 600px;
            background: rgba(0, 0, 0, 0.8);
            padding: 20px;
            border-radius: 10px;
            margin: 100px auto;
            text-align: center;
        }

        .btn-primary {
            background-color: #6a0dad;
            border: none;
        }

        .btn-primary:hover {
            background-color: #570b9a;
        }
    </style>
</head>

<body>

    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="VirtualPlayZone.html">
                <img src="../img/virtual3.png" width="35px" class="png">
                <strong>Virtual Play Zone</strong>
            </a>
        </div>
    </nav>

    <!-- Carrito de Compras -->
    <div class="carrito-container">
        <h2>Carrito de Compras</h2>
        <ul id="listaCarrito" class="list-group mb-3"></ul>
        <p><strong>Total:</strong> $<span id="totalCarrito">0</span></p>
        <button class="btn btn-success w-100" onclick="realizarPago()">Realizar Pago</button>
        <button class="btn btn-danger w-100 mt-2" onclick="vaciarCarrito()">Vaciar Carrito</button>
        <button class="btn btn-primary w-100 mt-2" onclick="window.location.href='virtualplayzone.html'">Volver al Inicio</button>
    </div>

    <script>
        let carrito = JSON.parse(localStorage.getItem("carrito")) || [];

        function actualizarCarrito() {
            let lista = document.getElementById("listaCarrito");
            let total = 0;
            lista.innerHTML = "";

            carrito.forEach((item, index) => {
                total += item.precio;
                let li = document.createElement("li");
                li.className = "list-group-item bg-dark text-white";
                li.innerHTML = `
                    ${item.nombre} - $${item.precio}
                    <button class="btn btn-danger btn-sm float-end" onclick="eliminarDelCarrito(${index})">X</button>
                `;
                lista.appendChild(li);
            });

            document.getElementById("totalCarrito").innerText = total;
            localStorage.setItem("carrito", JSON.stringify(carrito));
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarrito();
        }

        function vaciarCarrito() {
            carrito = [];
            actualizarCarrito();
        }

        function realizarPago() {
            let totalElemento = document.getElementById("totalCarrito");
            let total = parseFloat(totalElemento.innerText.trim());

            if (isNaN(total) || total <= 0) {
                alert("El carrito está vacío.");
                return;
            }

            // Redirigir a pago.html con el monto como parámetro en la URL
            window.location.href = "pago.html?monto=" + total;

        }

        actualizarCarrito();

    </script>

</body>
<div id="footer-container"></div>
<script>
    fetch('../footer.html')
        .then(response => {
            if (!response.ok) {
                throw new Error('Error al cargar el footer');
            }
            return response.text();
        })
        .then(html => {
            document.getElementById('footer-container').innerHTML = html;
        })
        .catch(error => console.error('Error:', error));
</script>
</html>
