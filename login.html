<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <style>
        body {
            background-image: url('../img/fondo.jpg');
            background-size: cover;
            background-position: center;
        }

        .login-container {
            max-width: 400px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border-radius: 10px;
            color: white;
            margin: 100px auto;
        }

        .form-control {
            background-color: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .btn-primary {
            background-color: #6a0dad;
            border: none;
        }

        .btn-primary:hover {
            background-color: #570b9a;
        }

        .error-message {
            color: red;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Menú de Navegación -->
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <img src="../img/virtual3.png" width="35px" class="png">
                <strong>Virtual Play Zone</strong>
            </a>
        </div>
    </nav>

    <!-- Formulario de Inicio de Sesión -->
    <div class="login-container">
        <h2 class="text-center">Iniciar Sesión</h2>
        <form onsubmit="return validarLogin(event)">
            <div class="mb-3">
                <input type="text" id="usuario" class="form-control" placeholder="Usuario" required>
            </div>
            <div class="mb-3">
                <input type="password" id="contrasena" class="form-control" placeholder="Contraseña" required>
            </div>
            <p id="error" class="error-message text-center"></p>
            <button type="submit" class="btn btn-primary w-100">Iniciar Sesión</button>
        </form>
        <div class="text-center mt-3">
            <a href="recuperar.html" class="text-light">Recuperar contraseña</a>
        </div>
    </div>

    <div id="footer-container"></div>

    <script>
        function validarLogin(event) {
            event.preventDefault();

            let usuario = document.getElementById("usuario").value;
            let contrasena = document.getElementById("contrasena").value;
            let errorMensaje = document.getElementById("error");

            const usuarioCorrecto = "admin";
            const contrasenaCorrecta = "1234";

            if (usuario === usuarioCorrecto && contrasena === contrasenaCorrecta) {
                localStorage.setItem("usuario", usuario);
                window.location.href = "usuario.html";
            } else {
                errorMensaje.innerText = "Usuario o contraseña incorrecta";
            }
        }
    </script>

    <script>
        fetch('../footer.html')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al cargar el footer');
                }
                return response.text();
            })
            .then(html => {
                document.getElementById('footer-container').innerHTML = html;
            })
            .catch(error => console.error('Error:', error));
    </script>
</body>

</html>
